    <script>
      // Guard against environments, extensions, or sandboxes where window.fetch has only a getter
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch;

          function defineFetchOn(target) {
            if (!target) return false;
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return activeFetch || originalFetch;
                },
                set: function(fn) {
                  activeFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
              return true;
            } catch (err) {
              return false;
            }
          }

          // 1. Walk prototype chain of window and redefine fetch with getter + setter
          var obj = window;
          while (obj) {
            try {
              var desc = Object.getOwnPropertyDescriptor(obj, 'fetch');
              if (desc) {
                defineFetchOn(obj);
              }
            } catch (e) {}
            obj = Object.getPrototypeOf(obj);
          }

          // 2. Define on Window.prototype explicitly
          if (typeof Window !== 'undefined' && Window.prototype) {
            defineFetchOn(Window.prototype);
          }

          // 3. Define on window directly
          defineFetchOn(window);

          // 4. Define on globalThis if distinct
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            defineFetchOn(globalThis);
          }
        } catch (e) {}

        // Global unhandled error guard for environments where window.fetch was made non-configurable with only a getter
        window.addEventListener('error', function(event) {
          if (event && event.message && typeof event.message === 'string' && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return true;
          }
        }, true);
      })();
    </script>
